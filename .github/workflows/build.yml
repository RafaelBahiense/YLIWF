name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.tools\vcpkg-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Identify native toolchain
        id: toolchain
        shell: powershell
        run: |
          . ./tools/Environment.ps1
          Initialize-Native
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $compilerHash = (Get-FileHash -LiteralPath (Get-Command cl).Source -Algorithm SHA256).Hash
          $identity = @($compilerHash, $env:ImageVersion, $env:WindowsSDKVersion, $env:WindowsSdkDir, (cmake --version), (ninja --version), $env:GITHUB_WORKSPACE) -join '|'
          $hasher = [Security.Cryptography.SHA256]::Create()
          try { $key = [BitConverter]::ToString($hasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($identity))).Replace('-', '').ToLowerInvariant() }
          finally { $hasher.Dispose() }
          "key=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: .tools/nuget/packages
          key: windows-nuget-v1-${{ hashFiles('global.json', '**/packages.lock.json', 'tools/NuGet.Config') }}
          restore-keys: windows-nuget-v1-
      - name: Cache pinned sources and downloads
        uses: actions/cache@v4
        with:
          path: |
            .tools/CommonLibSSE-NG
            .tools/downloads
            .tools/vcpkg/downloads
          # Pins and package sources change downloads; build-script edits do not.
          key: windows-downloads-v1-${{ hashFiles('tools/dependencies.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/ports/**') }}
      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .tools/vcpkg-binaries
          # vcpkg's ABI checks validate packages; unrelated CMake helpers do not
          # change their inputs. Keep the toolchain and overlay-port checks.
          key: windows-vcpkg-v1-${{ steps.toolchain.outputs.key }}-${{ hashFiles('tools/dependencies.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/ports/**') }}
      - name: Prepare native and .NET tools
        shell: powershell
        run: ./setup.ps1 -NativeOnly
      # Restore CommonLib's PCH, objects and library together with Ninja's
      # dependency records. Compiler caches cannot handle MSVC PCH inputs.
      # Mod objects and binaries are excluded so a restored cache cannot skip
      # rebuilding changed application sources, even during concurrent runs.
      - name: Cache CommonLib build and installed dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/native/release/_deps/clib-build
            build/native/release/vcpkg_installed
            build/native/release/.ninja_deps
            build/native/release/.ninja_log
          key: windows-native-v1-${{ steps.toolchain.outputs.key }}-${{ hashFiles('tools/dependencies.json', 'setup.ps1', 'build.ps1', 'tools/Environment.ps1', 'CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'vcpkg.json', 'vcpkg-configuration.json', 'assets/settings.ini') }}
      - name: Compile, test, and generate ESP
        shell: powershell
        run: ./build.ps1 -Target Verify
      - name: Lint C# and C++
        shell: powershell
        run: ./lint.ps1 -NativeAnalysis
      # Game/Creation Kit import sources are external inputs.
