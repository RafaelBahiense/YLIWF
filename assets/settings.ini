; Created on first launch when the user INI is missing.
; Existing files are preserved. Missing or invalid settings use built-in defaults.
; Use the settings menu's Save button to write your changes.
[General]
iMaxFollowers=8
; 0: fixed cap, 1: perks, 2: Speech levels
bFollowerOptionSelector=0
iSpeechLevelsPerSlot=10
sPerkForms=
bFollowerEssential=0
bFriendlyFireProtection=0
bFollowerSandbox=0
bFollowerCrossfireProtection=0
bFollowerHomes=0
; 0: close, 1: normal, 2: far
iFollowDistance=1
; Experimental travel formation: 0 off, 1 column, 2 line, 3 wedge.
iTravelFormation=0

[Hotkeys]
; Configure keyboard combinations in the Hotkeys tab. 0 means unbound.
iFollowAll=0
iWaitAll=0
iStandDown=0
iDistance=0
iFormation=0

[Debug]
bEnabled=0
bFlowLogging=0
